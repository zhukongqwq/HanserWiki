name: 构建与发布

# 推送 main 自动构建验证并发布；手动触发或推送 v* 标签同样构建并发布
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release 需要写权限
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 读取版本号与更新日志（来自 version.json）
        id: version
        shell: pwsh
        run: |
          $v = Get-Content -Raw version.json | ConvertFrom-Json
          $version = $v.version
          $body = "# Hanser AI Wiki v$version"
          if ($v.date) { $body += "`n`n发布日期：$($v.date)" }
          $body += "`n`n## 本版本更新日志`n"
          foreach ($c in $v.changelog) { $body += "- $c`n" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 发布（win-x64 自包含，非单文件）
        run: dotnet publish HanserWpf/HanserWpf.csproj -c Release -r win-x64 --self-contained true -o dist

      - name: 复制 jieba 词典到发布目录（运行时分词需要）
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force jieba-resources dist/

      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "Hanser-AI-Wiki-v${{ steps.version.outputs.version }}.zip" -Force

      - name: 创建 Release（自动同步版本号与更新日志）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hanser AI Wiki v${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.body }}
          files: Hanser-AI-Wiki-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
          update_release_body: true # 同版本重复推送时更新 Release 而非失败
