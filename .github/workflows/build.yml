name: 构建与发布

# 推送 main 自动构建验证；手动触发或推送 v* 标签时构建并发布
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 发布单文件 exe（win-x64 自包含）
        run: dotnet publish HanserWpf/HanserWpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - name: 读取版本号与更新日志（来自 version.json）
        id: version
        shell: pwsh
        run: |
          $v = Get-Content -Raw version.json | ConvertFrom-Json
          $version = $v.version
          $body = "# AI Hanser v$version"
          if ($v.date) { $body += "`n`n发布日期：$($v.date)" }
          $body += "`n`n## 本版本更新日志`n"
          foreach ($c in $v.changelog) { $body += "- $c`n" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 创建 Release（自动同步版本号与更新日志）
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AI Hanser v${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.body }}
          files: dist/*.exe
          draft: false
          prerelease: false
